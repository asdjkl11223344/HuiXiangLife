name: HuiXiangLife CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 后端/HuiXiangLife
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: huixiang-server-jar
          path: 后端/HuiXiangLife/huixiang-server/target/*.jar

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 前端
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 前端/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 前端/dist

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: 后端/HuiXiangLife
          file: 后端/HuiXiangLife/Dockerfile
          push: false
          tags: huixianglife/backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 前端/Dockerfile
          push: false
          tags: huixianglife/frontend:ci

  deploy-template:
    name: Deployment template
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Print deployment hint
        run: |
          echo "CI passed. Add SSH, registry login, or cloud provider steps here for production deployment."
          echo "Recommended production command: docker compose pull && docker compose up -d"
